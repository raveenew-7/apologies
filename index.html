  <title>7-Page Storybook</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Nunito for a cute, soft storybook feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #fdf6f8;
      background-image: radial-gradient(#f3d9e2 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      overflow-x: hidden;
    }

    h1, h2, .font-display {
      font-family: 'Quicksand', sans-serif;
    }

    /* Smooth card transition animations */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-page-enter {
      animation: popIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Cute floating & bouncing SVG animations (acting as built-in GIFs!) */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .anim-float { animation: floatSlow 3s ease-in-out infinite; }
    .anim-wiggle { animation: wiggle 2.5s ease-in-out infinite; transform-origin: center; }
    .anim-pulse { animation: pulseSoft 2.2s ease-in-out infinite; transform-origin: center; }
    .anim-spin { animation: spinSlow 14s linear infinite; transform-origin: center; }

    /* Custom subtle scrollbar for modal */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #fdf2f5;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #f4b8c8;
      border-radius: 10px;
    }
  </style>
</head>

      },
      sky: {
        bar: "from-sky-300 via-cyan-300 to-blue-200",
        frame: "bg-sky-50/80 border-sky-200",
        btn: "bg-sky-500 hover:bg-sky-600 shadow-sky-200",
        dot: "bg-sky-500",
        badge: "text-sky-600"
      },
      violet: {
        bar: "from-violet-300 via-purple-300 to-fuchsia-200",
        frame: "bg-violet-50/80 border-violet-200",
        btn: "bg-violet-500 hover:bg-violet-600 shadow-violet-200",
        dot: "bg-violet-500",
        badge: "text-violet-600"
      },
      indigo: {
        bar: "from-indigo-300 via-blue-300 to-purple-200",
        frame: "bg-indigo-50/80 border-indigo-200",
        btn: "bg-indigo-500 hover:bg-indigo-600 shadow-indigo-200",
        dot: "bg-indigo-500",
        badge: "text-indigo-600"
      }
    };

    // App State
    let pages = loadPages();
    let currentIndex = 0;

    // Load saved edits from localStorage if available
    function loadPages() {
      try {
        const saved = localStorage.getItem("cute_7_page_storybook");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length === 7) return parsed;
        }
      } catch (e) {
        console.warn("Could not read saved pages:", e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_PAGES));
    }

    function savePagesToStorage() {
      try {
        localStorage.setItem("cute_7_page_storybook", JSON.stringify(pages));
      } catch (e) {
        console.warn("Could not save pages:", e);
      }
    }

    // DOM Elements
    const pageCounter = document.getElementById("page-counter");
    const cardAccentBar = document.getElementById("card-accent-bar");
    const pageContent = document.getElementById("page-content");
    const mediaContainer = document.getElementById("media-container");
    const pageTitle = document.getElementById("page-title");
    const pageText = document.getElementById("page-text");
    const dotsContainer = document.getElementById("dots-container");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const nextBtnLabel = document.getElementById("next-btn-label");
    const nextBtnIcon = document.getElementById("next-btn-icon");

    // Render current page
    function renderPage(index) {
      currentIndex = index;
      const page = pages[currentIndex];
      const theme = THEME_STYLES[page.theme] || THEME_STYLES.pink;

      // Update Top Counter
      pageCounter.textContent = `Page ${currentIndex + 1} of ${pages.length}`;
      pageCounter.className = `text-sm font-bold tracking-wide uppercase transition-colors ${theme.badge}`;

      // Update Accent Strip
      cardAccentBar.className = `h-2.5 w-full bg-gradient-to-r transition-all duration-500 ${theme.bar}`;

      // Update Media Frame Style
      mediaContainer.className = `w-full max-w-[260px] h-52 sm:h-56 rounded-2xl border-2 border-dashed flex items-center justify-center overflow-hidden mb-6 shadow-inner relative transition-colors duration-300 ${theme.frame}`;

      // Render either custom GIF URL or built-in animated SVG
      mediaContainer.innerHTML = "";
      if (page.gifUrl && page.gifUrl.trim() !== "") {
        const img = document.createElement("img");
        img.src = page.gifUrl.trim();
        img.alt = page.title;
        img.className = "w-full h-full object-cover rounded-xl";
        // Fallback to cute SVG animation if GIF URL fails to load
        img.onerror = () => {
          mediaContainer.innerHTML = CUTE_ANIMATIONS[currentIndex];
        };
        mediaContainer.appendChild(img);
      } else {
        mediaContainer.innerHTML = CUTE_ANIMATIONS[currentIndex];
      }

      // Update Text
      pageTitle.textContent = page.title;
      pageText.textContent = page.text;

      // Re-trigger smooth entrance animation
      pageContent.classList.remove("animate-page-enter");
      void pageContent.offsetWidth; // Force reflow
      pageContent.classList.add("animate-page-enter");

      // Update Page Dots (1 to 7)
      dotsContainer.innerHTML = "";
      pages.forEach((_, idx) => {
        const dot = document.createElement("button");
        const isActive = idx === currentIndex;
        dot.type = "button";
        dot.setAttribute("aria-label", `Go to page ${idx + 1}`);
        dot.className = isActive
          ? `w-7 h-3 rounded-full transition-all duration-300 cursor-pointer ${theme.dot}`
          : "w-3 h-3 rounded-full bg-slate-200 hover:bg-slate-300 transition-all duration-300 cursor-pointer";
        dot.addEventListener("click", () => renderPage(idx));
        dotsContainer.appendChild(dot);
      });

      // Update Back & Next Buttons
      prevBtn.disabled = currentIndex === 0;

      nextBtn.className = `flex-1 py-3 px-5 rounded-2xl font-bold text-sm sm:text-base text-white shadow-md transition-all flex items-center justify-center gap-2 active:scale-95 cursor-pointer ${theme.btn}`;

      if (currentIndex === pages.length - 1) {
        nextBtnLabel.textContent = "Restart";
        nextBtnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>`;
      } else {
        nextBtnLabel.textContent = "Next";
        nextBtnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>`;
      }
    }

    // Navigation Handlers
    function goNext() {
      if (currentIndex < pages.length - 1) {
        renderPage(currentIndex + 1);
      } else {
        renderPage(0); // Loop back to Page 1 on Restart
      }
    }

    function goPrev() {
      if (currentIndex > 0) {
        renderPage(currentIndex - 1);
      }
    }

    nextBtn.addEventListener("click", goNext);
    prevBtn.addEventListener("click", goPrev);

    // Keyboard Navigation (Left / Right arrows)
    document.addEventListener("keydown", (e) => {
      if (!editorModal.classList.contains("hidden")) return; // Ignore while modal is open
      if (e.key === "ArrowRight") goNext();
      if (e.key === "ArrowLeft") goPrev();
    });

    // Touch Swipe Support for Mobile
    let touchStartX = 0;
    const cardEl = document.getElementById("storybook-card");

    cardEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    cardEl.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 45) {
        if (diff > 0) goNext(); // Swiped left -> Next page
        else goPrev();          // Swiped right -> Prev page
      }
    }, { passive: true });

    /**
     * ============================================================================
     * CUSTOMIZE MODAL LOGIC (Edit text & paste GIF URLs visually)
     * ============================================================================
     */
    const editorModal = document.getElementById("editor-modal");
    const openEditorBtn = document.getElementById("open-editor-btn");
    const closeEditorBtn = document.getElementById("close-editor-btn");
    const cancelEditorBtn = document.getElementById("cancel-editor-btn");
    const saveEditorBtn = document.getElementById("save-editor-btn");
    const resetDefaultsBtn = document.getElementById("reset-defaults-btn");
    const editorFields = document.getElementById("editor-fields");

    function openEditor() {
      editorFields.innerHTML = "";
      pages.forEach((p, idx) => {
        const item = document.createElement("div");
        item.className = "p-4 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-3";
        item.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-pink-500">Page ${idx + 1}</span>
            <select data-field="theme" data-index="${idx}" class="text-xs rounded-lg border border-slate-200 bg-white px-2 py-1 text-slate-600 focus:outline-none focus:border-pink-400">
              <option value="pink" ${p.theme === "pink" ? "selected" : ""}>Pink Theme</option>
              <option value="amber" ${p.theme === "amber" ? "selected" : ""}>Sunny Yellow</option>
              <option value="rose" ${p.theme === "rose" ? "selected" : ""}>Cozy Rose</option>
              <option value="emerald" ${p.theme === "emerald" ? "selected" : ""}>Mint Green</option>
              <option value="sky" ${p.theme === "sky" ? "selected" : ""}>Sky Blue</option>
              <option value="violet" ${p.theme === "violet" ? "selected" : ""}>Soft Lavender</option>
              <option value="indigo" ${p.theme === "indigo" ? "selected" : ""}>Dreamy Indigo</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Title</label>
            <input type="text" data-field="title" data-index="${idx}" value="${escapeHtml(p.title)}" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-pink-400" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Short Text</label>
            <textarea rows="2" data-field="text" data-index="${idx}" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-pink-400">${escapeHtml(p.text)}</textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">GIF URL <span class="font-normal text-slate-400">(optional - leave blank for cute built-in animation)</span></label>
            <input type="url" placeholder="https://media.giphy.com/media/.../giphy.gif" data-field="gifUrl" data-index="${idx}" value="${escapeHtml(p.gifUrl || "")}" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-pink-400" />
          </div>
        `;
        editorFields.appendChild(item);
      });

      editorModal.classList.remove("hidden");
      editorModal.classList.add("flex");
    }

    function closeEditor() {
      editorModal.classList.add("hidden");
      editorModal.classList.remove("flex");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    openEditorBtn.addEventListener("click", openEditor);
    closeEditorBtn.addEventListener("click", closeEditor);
    cancelEditorBtn.addEventListener("click", closeEditor);

    saveEditorBtn.addEventListener("click", () => {
      const inputs = editorFields.querySelectorAll("[data-field]");
      inputs.forEach((input) => {
        const idx = Number(input.dataset.index);
        const field = input.dataset.field;
        pages[idx][field] = input.value;
      });
      savePagesToStorage();
      renderPage(currentIndex);
      closeEditor();
    });

    resetDefaultsBtn.addEventListener("click", () => {
      pages = JSON.parse(JSON.stringify(DEFAULT_PAGES));
      savePagesToStorage();
      openEditor(); // Refresh modal inputs
      renderPage(currentIndex);
    });

    // Initialize Page 1 on Load
    window.addEventListener("DOMContentLoaded", () => {
      renderPage(0);
    });
  </script>
</body>
</html>
